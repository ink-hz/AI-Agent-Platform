name: HR content format compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  golden-vectors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cryptography==50.0.0 pytest==8.4.2
      - run: python -m pytest -q backend/tests/test_hr_content_crypto_vectors.py
        env:
          PYTHONPATH: backend
