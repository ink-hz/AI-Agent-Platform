agents:
  - agent_id: hr-bot
    display_name: HR Agent
    persona_subtitle: Hannah · 技术人才搜寻与招聘协作
    domain_group: HR
    mission: 帮助员工和管理者完成招聘、人事与员工服务任务。
    capabilities: [梳理岗位需求与候选人画像, 起草招聘沟通与面试材料, 解答人事流程与员工服务问题]
    exclusions: [不代替管理者作出录用、解雇或薪酬决定, 不处理未提供依据的个人敏感信息推断]
    required_inputs: [任务目标, 适用岗位、人员或制度背景]
    example_tasks: [根据岗位说明梳理候选人能力组合, 为一次结构化面试准备问题清单]
    interaction_modes: [direct_chat, brain_delegation]
    adapter_id: metabot-core-chat
    adapter_kind: metabot_local
    execution_pool: metabot_local
    pool_concurrency: 1
    supports_persistent_session: true
    supports_followup_message: true
    supports_progress_events: true
    supports_thinking_summary: true
    supports_cancel: true
    supports_attachments: false
    typical_latency_seconds: 90
    capability_version: 2

  - agent_id: voc
    display_name: VOC 洞察助手
    domain_group: 客户洞察
    mission: 将客户反馈整理为可编辑 VOC 草稿，确认后入库，并查看和补充本人记录。
    capabilities: [整理客户反馈为结构化草稿, 提交本人 VOC, 查看和补充本人记录]
    exclusions: [不代替用户确认并提交草稿, 不读取无权访问的他人 VOC]
    required_inputs: [客户反馈原文, 企业登录身份]
    example_tasks: [把客户反馈整理成 VOC 草稿, 查看并补充我提交的 VOC]
    interaction_modes: [external_workspace, brain_delegation]
    workspace_url: /agents/voc/workspace
    adapter_id: voc-platform-action-v1
    adapter_kind: voc_action
    execution_pool: voc_extension
    pool_concurrency: 1
    supports_streaming: false
    supports_cancellation: false
    supports_persistent_session: true
    supports_followup_message: false
    supports_progress_events: true
    supports_thinking_summary: false
    supports_cancel: false
    supports_attachments: false
    typical_latency_seconds: 30
    capability_version: 2

