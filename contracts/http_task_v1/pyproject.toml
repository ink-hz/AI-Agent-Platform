[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbbec-http-task-contract"
version = "1.0.0"
description = "Executable Orbbec HTTP Task Contract v1 black-box tests"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "jcs==0.2.1",
  "pydantic>=2.7,<3",
]

[project.scripts]
orbbec-task-contract = "orbbec_task_contract.runner:main"

[tool.setuptools]
packages = ["orbbec_task_contract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
