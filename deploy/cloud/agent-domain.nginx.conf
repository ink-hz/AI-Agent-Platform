log_format agent_platform_redacted
    '$request_method $uri $status $body_bytes_sent $request_time';

limit_req_zone $binary_remote_addr zone=ai_admin_office_chat:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=ai_admin_office_conn:10m;

# Never forward the platform's root-path session cookie to ZenTao.
map $cookie_lang $sdk_zentao_lang_cookie { default "; lang=$cookie_lang"; "" ""; }
map $cookie_vision $sdk_zentao_vision_cookie { default "; vision=$cookie_vision"; "" ""; }
map $cookie_device $sdk_zentao_device_cookie { default "; device=$cookie_device"; "" ""; }
map $cookie_theme $sdk_zentao_theme_cookie { default "; theme=$cookie_theme"; "" ""; }
map $cookie_zentaosid $sdk_zentao_cookie {
    default "zentaosid=$cookie_zentaosid$sdk_zentao_lang_cookie$sdk_zentao_vision_cookie$sdk_zentao_device_cookie$sdk_zentao_theme_cookie";
    "" "";
}

# Keep ZenTao UI private while allowing its versioned static files to stay in
# the employee's browser cache between page navigations.
map $uri $sdk_zentao_cache_control {
    default "no-store";
    ~^/sdk/(js|css|static|theme)/ "private, max-age=86400";
}

server {
    listen 80;
    server_name __AGENT_DOMAIN__;

    access_log /var/log/nginx/ai-fae-agent.access.log agent_platform_redacted;
    error_log /var/log/nginx/ai-fae-agent.error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 308 https://__AGENT_DOMAIN__$request_uri;
    }
}

# HTTPS_ENTRY_BEGIN
server {
    listen 443 ssl;
    server_name __AGENT_DOMAIN__;

    ssl_certificate __CERT_PATH__;
    ssl_certificate_key __KEY_PATH__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AGENT_PLATFORM_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;

    access_log /var/log/nginx/ai-fae-agent.access.log agent_platform_redacted;
    error_log /var/log/nginx/ai-fae-agent.error.log crit;

