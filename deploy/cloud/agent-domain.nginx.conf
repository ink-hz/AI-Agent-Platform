log_format agent_platform_redacted
    '$request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name __AGENT_DOMAIN__;

    access_log /var/log/nginx/ai-fae-agent.access.log agent_platform_redacted;
    error_log /var/log/nginx/ai-fae-agent.error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 308 https://__AGENT_DOMAIN__$request_uri;
    }
}

# HTTPS_ENTRY_BEGIN
server {
    listen 443 ssl;
    server_name __AGENT_DOMAIN__;

    ssl_certificate __CERT_PATH__;
    ssl_certificate_key __KEY_PATH__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AGENT_PLATFORM_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;

    access_log /var/log/nginx/ai-fae-agent.access.log agent_platform_redacted;
    error_log /var/log/nginx/ai-fae-agent.error.log crit;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/v1/internal/session/subject {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_set_header Authorization "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }
}
