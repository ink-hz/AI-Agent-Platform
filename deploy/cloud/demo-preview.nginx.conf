# Public surface for the short-lived DingTalk R1 demonstration.  The upstream
# application owns the exact public allowlist and all authenticated routes.
location = /_preview/dingtalk-r1 {
    auth_basic off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    return 308 /_preview/dingtalk-r1/;
}

location ^~ /_preview/dingtalk-r1/ {
    auth_basic off;
    client_max_body_size 1m;

    access_log /var/log/nginx/ai-fae-agent.access.log agent_platform_redacted;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_set_header Authorization "";

    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 330s;
    proxy_send_timeout 330s;
}
