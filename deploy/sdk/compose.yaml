name: orbbec-sdk-workbench-trial

services:
  zentao-db:
    image: ${SDK_DB_IMAGE:-mariadb:10.6}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: zentao
      MARIADB_USER: zentao
      MARIADB_PASSWORD: ${SDK_DB_PASSWORD:?set SDK_DB_PASSWORD in a mode 0600 env file}
      MARIADB_ROOT_PASSWORD: ${SDK_DB_ROOT_PASSWORD:?set SDK_DB_ROOT_PASSWORD in a mode 0600 env file}
    volumes:
      - zentao-db:/var/lib/mysql
    networks:
      - sdk-private
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  zentao:
    image: ${SDK_ZENTAO_IMAGE:?set an audited hardened ZenTao image}
    entrypoint: ["/usr/local/bin/verify-and-start.sh"]
    restart: unless-stopped
    environment:
      MYSQL_INTERNAL: "false"
      ZT_MYSQL_HOST: zentao-db
      ZT_MYSQL_PORT: "3306"
      ZT_MYSQL_DB: zentao
      ZT_MYSQL_USER: zentao
      ZT_MYSQL_PASSWORD: ${SDK_DB_PASSWORD:?set SDK_DB_PASSWORD in a mode 0600 env file}
      ZT_DEFAULT_LANG: zh-cn
      DEBUG: "false"
    volumes:
      - zentao-data:/data
    ports:
      - "127.0.0.1:18131:80"
    networks:
      - sdk-private
      - sdk-bridge
      - sdk-admin
    depends_on:
      zentao-db:
        condition: service_healthy

networks:
  sdk-private:
    internal: true
  sdk-admin:
    internal: false
  sdk-bridge:
    external: true
    name: orbbec-agent-platform-sdk

volumes:
  zentao-db:
  zentao-data:
