server {
    listen 80;
    server_name __SDK_DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 308 https://__SDK_DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name __SDK_DOMAIN__;

    ssl_certificate __CERT_PATH__;
    ssl_certificate_key __KEY_PATH__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    access_log /var/log/nginx/orbbec-sdk-zentao.access.log;
    error_log /var/log/nginx/orbbec-sdk-zentao.error.log warn;
    client_max_body_size 100m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /sdk-sso/consume {
        if ($request_method != POST) { return 405; }
        client_max_body_size 1k;
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://127.0.0.1:8080/api/v1/sdk/sso/consume;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_buffering off;
        proxy_cache off;
    }

    # The passwordless entry uses legacy /api.php query routing. Keep the
    # entire public legacy endpoint closed; private Docker calls bypass Nginx.
    location = /api.php { return 403; }

    location / {
        if ($arg_f = apilogin) { return 403; }
        if ($request_uri ~* "user-apilogin") { return 403; }
        proxy_pass http://127.0.0.1:18131;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }
}
